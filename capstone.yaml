# Capstone Project Manifest

run:
  command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  health_check: "GET /health"
  port: 8000

seed:
  command: "python scripts/seed.py"
  description: "Populate database with images, tags, posts, and eval set"

test:
  command: "pytest -v"
  coverage: "pytest --cov=app --cov-report=term-missing"

base_url: "http://localhost:8000"

endpoints:
  - path: "/health"
    method: "GET"
    description: "Health check endpoint"
    expected_status: 200

  - path: "/images"
    method: "GET"
    description: "List all images with metadata"
    expected_status: 200

  - path: "/images/{image_id}"
    method: "GET"
    description: "Get image details including tags and embeddings"
    expected_status: 200

  - path: "/posts"
    method: "GET"
    description: "List all blog posts"
    expected_status: 200

  - path: "/posts/{post_id}/suggestions"
    method: "GET"
    description: "Get ranked image suggestions for a post with mismatch guard results"
    expected_status: 200

  - path: "/suggestions/{suggestion_id}/approve"
    method: "POST"
    description: "Approve a suggested image for a post"
    expected_status: 200

  - path: "/suggestions/{suggestion_id}/reject"
    method: "POST"
    description: "Reject a suggested image with reason"
    expected_status: 200

  - path: "/eval/run"
    method: "POST"
    description: "Run evaluation against eval_set.json"
    expected_status: 200