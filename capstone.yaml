# Capstone Project Manifest

run:
  command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  health_check: "GET /health"
  port: 8000

seed:
  command: "python scripts/seed_v2.py"
  description: "Populate database with 26 verified images, tags, 10 posts, and eval set"

vision:
  command: "python scripts/run_vision_pipeline.py"
  description: "Run Ollama llava vision classification on all images (local, no quota)"

embeddings:
  command: "python scripts/run_embeddings.py"
  description: "Generate nomic-embed-text embeddings for images and posts"

matching:
  command: "python scripts/run_matching.py"
  description: "Run matching pipeline with mismatch guard evaluation"

eval:
  command: "python scripts/eval_precision.py"
  description: "Compute TOP-1 precision against eval_set.json"

test:
  command: "pytest -v"
  coverage: "pytest --cov=app --cov-report=term-missing"

base_url: "http://localhost:8000"

endpoints:
  - path: "/health"
    method: "GET"
    description: "Health check endpoint"
    expected_status: 200

  - path: "/posts"
    method: "GET"
    description: "List all blog posts"
    expected_status: 200

  - path: "/posts/{post_id}/suggestions"
    method: "GET"
    description: "Get ranked image suggestions for a post with mismatch guard results"
    expected_status: 200

  - path: "/suggestions/{suggestion_id}/approve"
    method: "POST"
    description: "Approve a suggested image for a post"
    expected_status: 200

  - path: "/suggestions/{suggestion_id}/reject"
    method: "POST"
    description: "Reject a suggested image with reason"
    expected_status: 200

  - path: "/posts/{post_id}/approved-image"
    method: "GET"
    description: "Get the approved image for a post (if any)"
    expected_status: 200